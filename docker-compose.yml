services:
  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-mirea_rag}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-mirea_rag}
      POSTGRES_DB: ${POSTGRES_DB:-mirea_rag}
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-mirea_rag}"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  pgdata:
