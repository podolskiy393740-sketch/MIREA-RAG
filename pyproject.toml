[project]
name = "mirea-rag"
version = "0.1.0"
description = "RAG-помощник МИРЭА"
requires-python = ">=3.11"
dependencies = [
    "aiogram>=3.13",
    "pydantic>=2.9",
    "pydantic-settings>=2.5",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]
include = ["src*"]
